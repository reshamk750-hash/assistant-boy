<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Boy</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#071b49,#0754a5,#08b9dc);
  color:white;text-align:center;
  padding:20px 14px 30px;
}
.card{
  max-width:440px;margin:auto;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.25);
  border-radius:28px;padding:22px 18px;
  box-shadow:0 15px 40px #00102b66;
}
h1{margin:5px 0;font-size:32px}
.sub{margin:8px 0 18px;color:#d9f6ff}
.boy{
  width:220px;height:220px;border-radius:50%;
  margin:10px auto 18px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#e5f8ff,#70d8ff);
  border:5px solid #fff;
  box-shadow:0 0 35px #4be7ff99;
  font-size:145px;
}
.bubble{
  background:white;color:#092d67;
  padding:16px;border-radius:18px;
  font-size:19px;line-height:1.5;
  margin:15px 0;
}
button{
  width:100%;border:0;border-radius:15px;
  padding:15px;margin:7px 0;
  font-size:18px;font-weight:bold;
  background:#fff;color:#06458b;
}
button:active{transform:scale(.98)}
#status{font-size:14px;color:#d5f8ff;margin:10px}
footer{margin-top:18px;color:#c9f4ff;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>🤖 Assistant Boy</h1>
  <div class="sub">तुम्हारा अपना स्मार्ट दोस्त ❤️</div>

  <img src="file_0000000002548207857b39de1858f892.png"
     style="width:100%;max-width:340px;height:auto;border-radius:25px;">

  <div class="bubble" id="answer">
    नमस्ते भाई! 😊<br>
    मैं हूँ Assistant Boy।<br>
    बताओ, मैं तुम्हारी क्या मदद करूँ?
  </div>

  <button onclick="listen()">🎤 मुझसे बात करो</button>
  <button onclick="speak()">🔊 मेरा जवाब सुनो</button>
  <div id="status">तैयार हूँ, भाई!</div>
  <footer>हम साथ मिलकर इसे और बेहतर बनाएँगे 💙</footer>
</div>

<script>
let lastAnswer = "नमस्ते भाई! मैं हूँ Assistant Boy। बताओ, मैं तुम्हारी क्या मदद करूँ?";

function speak(){
  if(!('speechSynthesis' in window)){
    document.getElementById('status').textContent =
      'इस ब्राउज़र में बोलने की सुविधा उपलब्ध नहीं है।';
    return;
  }
  speechSynthesis.cancel();
  let msg = new SpeechSynthesisUtterance(lastAnswer);
  msg.lang = 'hi-IN';
  msg.rate = 0.9;
  speechSynthesis.speak(msg);
}

function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('status').textContent =
      'भाई, बोलने के लिए Chrome में माइक्रोफ़ोन इस्तेमाल करो।';
    return;
  }
  const rec = new SR();
  rec.lang = 'hi-IN';
  rec.onstart = () => {
    document.getElementById('status').textContent = 'सुन रहा हूँ, भाई... 🎧';
  };
  rec.onresult = (e) => {
    const q = e.results[0][0].transcript.toLowerCase();
    let a;
    if(q.includes('नमस्ते') || q.includes('हेलो') || q.includes('हाय')){
      a = 'नमस्ते भाई! 😊 कैसे हो?';
    }else if(q.includes('तुम्हारा नाम') || q.includes('नाम क्या')){
      a = 'मेरा नाम Assistant Boy है। मैं तुम्हारा दोस्त हूँ!';
    }else if(q.includes('कैसे हो')){
      a = 'मैं बढ़िया हूँ भाई! तुम कैसे हो?';
    }else if(q.includes('धन्यवाद') || q.includes('थैंक यू')){
      a = 'तुम्हारा स्वागत है भाई! ❤️';
    }else if(q.includes('बाय') || q.includes('अलविदा')){
      a = 'ठीक है भाई, फिर मिलेंगे!';
    }else{
      a = 'भाई, मैंने सुना: ' + e.results[0][0].transcript +
          '। अभी मैं सीख रहा हूँ।';
    }
    lastAnswer = a;
    document.getElementById('answer').textContent = a;
    document.getElementById('status').textContent = 'तुम्हारी बात सुन ली! 😊';
    speak();
  };
  rec.onerror = () => {
    document.getElementById('status').textContent =
      'माइक चालू नहीं हुआ। ब्राउज़र की माइक्रोफ़ोन अनुमति जाँचो।';
  };
  rec.start();
}
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Boy</title>
<style>
body {
  margin: 0; min-height: 100vh;
  background: linear-gradient(145deg,#10152f,#164a70);
  color: white; font-family: Arial,sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 20px;
  box-sizing: border-box;
}
.robot { font-size: 100px; animation: float 2s infinite ease-in-out; }
@keyframes float { 50% { transform: translateY(-10px); } }
h1 { color: #65e4ff; }
button {
  border: 0; border-radius: 14px; padding: 14px 20px;
  margin: 7px; font-size: 17px; cursor: pointer;
}
#listen { background: #36d6b0; }
#talk { background: #65b5ff; }
#status { color: #ffe28a; min-height: 24px; }
#answer { max-width: 450px; line-height: 1.6; }
</style>
</head>
<body>
<div class="robot">🤖</div>
<h1>Assistant Boy</h1>
<p>नमस्ते दोस्त! मैं तुम्हारा असिस्टेंट हूँ।</p>
<button id="listen" onclick="listenNow()">🎤 बोलकर बात करो</button>
<button id="talk" onclick="say('नमस्ते दोस्त! बताओ, मैं तुम्हारी क्या मदद करूँ?')">🔊 मुझे बुलाओ</button>
<p id="status">तैयार हूँ, दोस्त!</p>
<p id="answer">मुझसे हिंदी में बात करो।</p>

<script>
function say(text) {
  document.getElementById("answer").textContent = text;
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "hi-IN";
    msg.rate = 0.9;
    speechSynthesis.speak(msg);
  }
}

function listenNow() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    say("दोस्त, इस ब्राउज़र में आवाज़ पहचानने की सुविधा उपलब्ध नहीं है।");
    return;
  }
  const rec = new SR();
  rec.lang = "hi-IN";
  rec.onstart = () => {
    document.getElementById("status").textContent = "सुन रहा हूँ...";
  };
  rec.onresult = (event) => {
    const words = event.results[0][0].transcript.toLowerCase();
    document.getElementById("status").textContent = "तुमने कहा: " + words;
    let reply;
    if (words.includes("hello") || words.includes("हेलो") || words.includes("नमस्ते")) {
      reply = "हेलो दोस्त! मैं Assistant Boy हूँ। बताओ, मैं तुम्हारी क्या मदद करूँ?";
    } else if (words.includes("नाम")) {
      reply = "मेरा नाम Assistant Boy है। मैं तुम्हारा निजी असिस्टेंट हूँ।";
    } else if (words.includes("कैसे हो")) {
      reply = "मैं बढ़िया हूँ दोस्त! तुम कैसे हो?";
    } else if (words.includes("समय") || words.includes("टाइम")) {
      reply = "दोस्त, सही समय देखने के लिए अपने टैबलेट की घड़ी देखो।";
    } else if (words.includes("धन्यवाद") || words.includes("शुक्रिया")) {
      reply = "तुम्हारा स्वागत है दोस्त! मैं मदद के लिए यहाँ हूँ।";
    } else if (words.includes("बाय") || words.includes("अलविदा")) {
      reply = "ठीक है दोस्त! फिर मिलेंगे।";
    } else {
      reply = "दोस्त, मैंने सुना: " + words + "। मैं अभी सीख रहा हूँ।";
    }
    say(reply);
  };
  rec.onerror = () => {
    document.getElementById("status").textContent =
      "माइक की अनुमति जाँचो और फिर कोशिश करो।";
  };
  rec.onend = () => {};
  rec.start();
}
</script>
</body>
</html>
